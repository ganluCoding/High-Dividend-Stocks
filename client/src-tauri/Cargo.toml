[package]
name = "high-dividend-desktop"
version = "0.1.0"
description = "Local-first China high dividend research desktop client"
authors = ["ganluCoding"]
edition = "2021"

[lib]
name = "high_dividend_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
